<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanno · Варіанти форми відгуку</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="review-form.css">
  <script src="review-form.js" defer></script>
</head>
<body>
  <div class="studio">
    <header class="studio-heading">
      <div><p class="eyebrow">SCANNO / DESIGN EXPLORATION</p><h1>Твій смак. Твій відгук.</h1></div>
      <span class="prototype-label"><span></span> Інтерактивні макети</span>
    </header>
    <div class="studio-controls">
      <div class="concept-tabs" role="tablist" aria-label="Варіант форми">
        <button type="button" role="tab" id="tab-balanced" aria-selected="true" aria-controls="concept-panel" data-concept="balanced"><span>01</span> Баланс <small>Рекомендую</small></button>
        <button type="button" role="tab" id="tab-compact" aria-selected="false" aria-controls="concept-panel" tabindex="-1" data-concept="compact"><span>02</span> Компактний</button>
        <button type="button" role="tab" id="tab-verdict" aria-selected="false" aria-controls="concept-panel" tabindex="-1" data-concept="verdict"><span>03</span> Вердикт</button>
      </div>
      <div class="device-controls" aria-label="Ширина макета">
        <button type="button" data-device="desktop" aria-label="На всю ширину" aria-pressed="true" title="На всю ширину"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M8 21h8m-4-5v5"/></svg></button>
        <button type="button" data-device="mobile" aria-label="Телефон, 390 пікселів" aria-pressed="false" title="Телефон, 390 px"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg></button>
      </div>
    </div>
    <p class="concept-description" id="concept-description">Основне — ліворуч, деталі покупки — праворуч. Усе видно одразу, кожен блок має своє місце.</p>
    <main id="concept-panel" role="tabpanel" aria-labelledby="tab-balanced">
      <div class="preview-frame" id="preview-frame">
        <header class="app-header" lang="en">
          <a href="/products/16" class="brand" aria-label="Scanno, back to product">Scanno<span></span></a>
          <nav aria-label="Main navigation">
            <a href="/explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5L16 8Z"/></svg>Explore</a>
            <a href="/search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg>Search</a>
            <a href="/diary"><svg viewBox="0 0 24 24"><path d="M12 5c-3-2-7-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-6-1-9 1Zm0 0v15"/></svg>Diary</a>
          </nav>
          <span class="profile"><span class="avatar">P</span><span>Poofik</span></span>
        </header>
        <div class="app-content" lang="en">
          <div class="context-line"><a href="/products/16">Product</a><span>/</span><span>Reviews</span></div>
          <section class="reviews-shell" id="reviews-shell"></section>
        </div>
      </div>
    </main>
    <footer class="studio-footer"><span>Зірки, вердикт, видимість і поля можна спробувати.</span><span>Макет • дані не надсилаються</span></footer>
  </div>
</body>
</html>
