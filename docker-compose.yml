services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scanno
      POSTGRES_USER: scanno
      POSTGRES_PASSWORD: scanno
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanno -d scanno"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scanno
      MINIO_ROOT_PASSWORD: scannosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 scanno scannosecret;
      mc mb -p local/scanno || true;
      mc anonymous set download local/scanno || true;
      exit 0;
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_dev &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgres://scanno:scanno@db:5432/scanno
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-scanno-secret-key-min-32-chars!!
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AWS_ACCESS_KEY_ID: scanno
      AWS_SECRET_ACCESS_KEY: scannosecret
      AWS_STORAGE_BUCKET_NAME: scanno
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_CUSTOM_DOMAIN: localhost:9000/scanno
      USE_S3: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  media_data:
